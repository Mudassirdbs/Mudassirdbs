name: Update profile art

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  workflow_dispatch:      # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Fetch contributions
        env:
          GH_PROFILE_USER: Mudassirdbs
        run: |
          python scripts/fetch_contributions.py

      - name: Render heatmap
        run: |
          python scripts/render_heatmap_svg.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add contrib-heatmap.svg data/contributions.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update contribution graph" && git push)
